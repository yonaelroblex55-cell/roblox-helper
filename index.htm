<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yona Uncopylocked</title>
</head>

<body style="
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
">

    <div>
        <h1 style="font-size:50px;">
            🎮 Yona Uncopylocked
        </h1>

        <p style="font-size:20px;color:#aaa;">
            ¡La página funciona!
        </p>

        <input
            id="link"
            placeholder="Pega tu link de Roblox"
            style="
                width:300px;
                padding:15px;
                border-radius:10px;
                border:0;
            "
        >

        <button
            onclick="buscar()"
            style="
                padding:15px 20px;
                margin-left:5px;
                border:0;
                border-radius:10px;
                background:#00a2ff;
                color:white;
                font-weight:bold;
            "
        >
            Buscar
        </button>

        <p id="resultado"></p>
    </div>

    <script>
        function buscar() {
            const link = document.getElementById("link").value;
            const resultado = document.getElementById("resultado");

            if (link.includes("roblox.com")) {
                resultado.innerHTML = "✅ Link de Roblox detectado";
            } else {
                resultado.innerHTML = "❌ Ese no parece ser un link de Roblox";
            }
        }
    </script>

</body>
</html>
