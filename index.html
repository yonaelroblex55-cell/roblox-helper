```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roblox Helper</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #242424 0%, #101010 45%, #080808 100%);
            color: white;
        }

        /* NAVBAR */

        .navbar {
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: rgba(15, 15, 15, 0.92);
            border-bottom: 1px solid #292929;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #00a2ff;
        }

        .status {
            font-size: 13px;
            color: #9b9b9b;
        }

        /* HERO */

        .hero {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 85px 20px 40px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(0, 162, 255, 0.12);
            border: 1px solid rgba(0, 162, 255, 0.35);
            color: #45b8ff;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(38px, 7vw, 72px);
            line-height: 1;
            margin-bottom: 18px;
            font-weight: 900;
        }

        h1 span {
            color: #00a2ff;
        }

        .description {
            max-width: 650px;
            margin: auto;
            color: #a8a8a8;
            font-size: 17px;
            line-height: 1.6;
        }

        /* SEARCH */

        .search-box {
            max-width: 760px;
            margin: 38px auto 0;
            padding: 8px;
            display: flex;
            gap: 8px;
            background: #171717;
            border: 1px solid #303030;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0,0,0,.35);
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            height: 55px;
            padding: 0 18px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 15px;
        }

        .search-box input::placeholder {
            color: #777;
        }

        .search-box button {
            height: 55px;
            padding: 0 27px;
            border: none;
            border-radius: 10px;
            background: #00a2ff;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
        }

        .search-box button:hover {
            background: #008fe0;
            transform: translateY(-1px);
        }

        .search-box button:active {
            transform: scale(.97);
        }

        /* RESULT */

        .result {
            display: none;
            max-width: 760px;
            margin: 25px auto 0;
            padding: 22px;
            background: #171717;
            border: 1px solid #303030;
            border-radius: 16px;
            text-align: left;
        }

        .result.show {
            display: block;
        }
